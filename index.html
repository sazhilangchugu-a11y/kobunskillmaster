  <script>
    /* Web Audio Sound Synthesizer for BGM and Sound Effects */
    class SoundManager {
      constructor() {
        this.enabled = true;
        this.bgmEnabled = false;
        this.ctx = null;
        this.bgmTimer = null;
        this.pentatonicNotes = [220.00, 246.94, 261.63, 329.63, 349.23, 440.00, 493.88, 523.25, 659.25];
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleSound() {
        this.enabled = !this.enabled;
        const icon = document.getElementById('icon-audio');
        const label = document.getElementById('label-audio');
        if (this.enabled) {
          icon.className = "fas fa-volume-up text-gold";
          label.innerText = "SE ON";
          this.playClick();
        } else {
          icon.className = "fas fa-volume-mute text-gray-400";
          label.innerText = "SE OFF";
        }
      }

      toggleBGM() {
        this.initCtx();
        this.bgmEnabled = !this.bgmEnabled;
        const icon = document.getElementById('icon-bgm');
        const label = document.getElementById('label-bgm');
        
        if (this.bgmEnabled) {
          icon.className = "fas fa-music text-vermilion animate-pulse";
          label.innerText = "BGM ON";
          this.startBGM();
        } else {
          icon.className = "fas fa-music text-gold";
          label.innerText = "BGM OFF";
          this.stopBGM();
        }
      }

      startBGM() {
        if (this.bgmTimer) clearInterval(this.bgmTimer);
        this.playBGMNote();
        this.bgmTimer = setInterval(() => {
          if (this.bgmEnabled) {
            this.playBGMNote();
          }
        }, 1800);
      }

      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      playBGMNote() {
        if (!this.ctx || !this.bgmEnabled) return;
        const note = this.pentatonicNotes[Math.floor(Math.random() * this.pentatonicNotes.length)];
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(note, this.ctx.currentTime);
        
        gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, this.ctx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.start();
        osc.stop(this.ctx.currentTime + 2.6);
      }

      playClick() {
        if (!this.enabled) return;
        this.initCtx();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }

      playCorrect() {
        if (!this.enabled) return;
        this.initCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
        });
      }

      playIncorrect() {
        if (!this.enabled) return;
        this.initCtx();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.setValueAtTime(207.65, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }
    }

    const sound = new SoundManager();
  </script>

      // ★選択肢をランダムにシャッフルするヘルパー関数
      prepareShuffledQuestion(q) {
        // 各選択肢に正解かどうかのフラグを持たせてオブジェクト化
        let mappedOptions = q.options.map((opt, idx) => ({
          text: opt,
          isCorrect: idx === q.answer
        }));

        // シャッフル
        mappedOptions.sort(() => Math.random() - 0.5);

        // 新しい正解インデックスを特定
        let newCorrectIndex = mappedOptions.findIndex(item => item.isCorrect);

        return {
          ...q,
          shuffledOptions: mappedOptions.map(item => item.text),
          correctIndex: newCorrectIndex
        };
      }

      startQuiz(category, count = 10) {
        sound.playClick();
        this.selectedCategory = category;
        
        let available = [];
        if (category === 'ALL') {
          available = [...QUESTION_BANK];
        } else {
          available = QUESTION_BANK.filter(q => q.category === category);
        }
        
        available.sort(() => Math.random() - 0.5);
        
        let rawQuestions = (count && count < available.length) ? available.slice(0, count) : available;

        // 各問題の選択肢をシャッフル処理
        this.quizQuestions = rawQuestions.map(q => this.prepareShuffledQuestion(q));

        this.currentIndex = 0;
        this.score = 0;
        this.userAnswers = [];
        this.currentView = 'drill';
        
        this.renderQuestion();
      }

        this.currentIndex = 0;
        this.score = 0;
        this.userAnswers = [];
        this.currentView = 'short_story';

        this.renderShortStoryQuestion();
      }

      renderQuestion() {
        const container = document.getElementById('app-container');
        const q = this.quizQuestions[this.currentIndex];
        const progressPercent = Math.round(((this.currentIndex) / this.quizQuestions.length) * 100);

        container.innerHTML = `
          <div class="max-w-2xl mx-auto w-full space-y-6">
            <!-- Progress & Abort Bar -->
            <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
              <span class="font-bold text-vermilion">第 ${this.currentIndex + 1} 問 / 全 ${this.quizQuestions.length} 問</span>
              <button onclick="app.confirmAbort()" class="hover:text-red-500 transition flex items-center gap-1">
                <i class="fas fa-times-circle"></i> 演習を中断
              </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
              <div class="bg-gold h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>

            <!-- Question Card -->
            <div class="bg-white dark:bg-nightCard border-2 border-gold/40 rounded-2xl p-6 sm:p-8 shadow-lg space-y-6">
              <div class="flex items-center justify-between border-b border-gold/20 pb-3">
                <span class="px-3 py-1 bg-indigo/10 dark:bg-gold/20 text-indigo dark:text-gold text-xs font-bold rounded-full">
                  ${q.category}
                </span>
                <span class="text-xs text-gray-400">正解数: ${this.score}</span>
              </div>

              <h3 class="font-japanese-title text-lg sm:text-xl font-bold leading-relaxed text-indigo dark:text-gray-100">
                ${q.question}
              </h3>

              <!-- Options (Shuffled) -->
              <div class="space-y-3 pt-2">
                ${q.shuffledOptions.map((opt, idx) => `
                  <button onclick="app.submitAnswer(${idx})" class="w-full p-4 text-left rounded-xl border border-gray-200 dark:border-gray-700 hover:border-gold hover:bg-gold/10 transition text-sm sm:text-base font-medium flex items-start gap-3 group">
                    <span class="w-6 h-6 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 font-bold flex items-center justify-center text-xs group-hover:bg-vermilion group-hover:text-white transition flex-shrink-0 mt-0.5">
                      ${['ア', 'イ', 'ウ', 'エ'][idx]}
                    </span>
                    <span class="flex-grow">${opt}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      submitAnswer(choiceIdx) {
        const q = this.quizQuestions[this.currentIndex];
        const isCorrect = choiceIdx === q.correctIndex;
        
        if (isCorrect) {
          sound.playCorrect();
          this.score++;
        } else {
          sound.playIncorrect();
        }

        this.userAnswers.push({
          question: q,
          userChoice: choiceIdx,
          isCorrect: isCorrect
        });

        this.showExplanationModal(q, choiceIdx, isCorrect, false);
      }

      showExplanationModal(q, userAnsIdx, isCorrect, isShortStory = false) {
        const modal = document.createElement('div');
        modal.id = 'modal-explanation';
        modal.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in';
        
        modal.innerHTML = `
          <div class="bg-white dark:bg-nightCard border-2 border-gold/40 rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-full flex items-center justify-center text-xl text-white font-bold shadow ${isCorrect ? 'bg-green-600' : 'bg-vermilion'}">
                <i class="fas ${isCorrect ? 'fa-check' : 'fa-times'}"></i>
              </span>
              <div>
                <h3 class="font-japanese-title text-xl font-bold ${isCorrect ? 'text-green-600' : 'text-vermilion'}">
                  ${isCorrect ? '正解！' : '不正解…'}
                </h3>
                <p class="text-xs text-gray-400">正解は：${['ア', 'イ', 'ウ', 'エ'][q.correctIndex]} 「${q.shuffledOptions[q.correctIndex]}」</p>
              </div>
            </div>

            <div class="bg-washi dark:bg-nightSumi p-4 rounded-xl border border-gold/30 text-sm space-y-2">
              <p class="font-bold text-indigo dark:text-gold text-xs uppercase tracking-wider">解説</p>
              <p class="text-gray-700 dark:text-gray-200 leading-relaxed">${q.explanation}</p>
            </div>

            <button onclick="app.nextQuestion(${isShortStory})" class="w-full py-3 bg-indigo dark:bg-gold dark:text-sumi text-white font-bold rounded-xl text-sm shadow hover:opacity-90 transition flex items-center justify-center gap-2">
              次の問題へ <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        `;
        document.body.appendChild(modal);
      }

      nextQuestion(isShortStory = false) {
        sound.playClick();
        const modal = document.getElementById('modal-explanation');
        if (modal) modal.remove();

        this.currentIndex++;
        if (this.currentIndex < this.quizQuestions.length) {
          if (isShortStory) {
            this.renderShortStoryQuestion();
          } else {
            this.renderQuestion();
          }
        } else {
          this.renderResult();
        }
      }

      confirmAbort() {
        sound.playClick();
        if (confirm("演習を中断してトップに戻りますか？")) {
          this.navHome();
        }
      }

      renderResult() {
        this.currentView = 'result';
        sound.playClick();
        const container = document.getElementById('app-container');
        const percentage = Math.round((this.score / this.quizQuestions.length) * 100);

        let rank = "可";
        let color = "text-yellow-600";
        if (percentage >= 90) { rank = "秀（免許皆伝）"; color = "text-gold"; }
        else if (percentage >= 70) { rank = "優（文法上級）"; color = "text-indigo dark:text-gold"; }
        else if (percentage >= 50) { rank = "良（修練中）"; color = "text-blue-600"; }

        const isShortStoryResult = this.selectedCategory === '短文読解演習';

        container.innerHTML = `
          <div class="max-w-2xl mx-auto w-full space-y-8 animate-fade-in">
            <!-- Score Card -->
            <div class="bg-white dark:bg-nightCard border-2 border-gold/40 rounded-2xl p-8 text-center shadow-xl space-y-4">
              <span class="px-3 py-1 bg-gold/20 text-gold text-xs font-bold rounded-full">${this.selectedCategory} 結果</span>
              <h2 class="font-japanese-title text-3xl font-extrabold text-indigo dark:text-gray-100">演習修了</h2>
              
              <div class="py-4">
                <div class="text-5xl font-black ${color} font-japanese-title">${percentage}<span class="text-2xl">%</span></div>
                <p class="text-sm text-gray-500 mt-1">正解数: ${this.score} / ${this.quizQuestions.length} 問</p>
                <p class="text-lg font-bold mt-2 font-japanese-title">${rank}</p>
              </div>

              <div class="flex flex-wrap gap-3 justify-center pt-2">
                ${isShortStoryResult ? `
                  <button onclick="app.startShortStoryQuiz()" class="px-6 py-3 bg-vermilion text-white font-bold rounded-xl text-sm shadow hover:bg-red-700 transition">
                    <i class="fas fa-redo mr-1"></i> もう一度読解演習
                  </button>
                ` : `
                  <button onclick="app.openCategoryModal('${this.selectedCategory}')" class="px-6 py-3 bg-vermilion text-white font-bold rounded-xl text-sm shadow hover:bg-red-700 transition">
                    <i class="fas fa-redo mr-1"></i> もう一度挑戦
                  </button>
                `}
                <button onclick="app.navHome()" class="px-6 py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-xl text-sm hover:bg-gray-300 transition">
                  <i class="fas fa-home mr-1"></i> ホームへ戻る
                </button>
              </div>
            </div>

            <!-- Review Answer History -->
            <div class="space-y-4">
              <h3 class="font-japanese-title text-lg font-bold border-b border-gold/30 pb-2">解答振り返り一覧</h3>
              <div class="space-y-3">
                ${this.userAnswers.map((item, idx) => `
                  <div class="bg-white dark:bg-nightCard border border-gold/20 rounded-xl p-4 space-y-2">
                    <div class="flex items-start justify-between gap-2">
                      <span class="font-bold text-xs text-gray-400">問 ${idx + 1}</span>
                      <span class="px-2 py-0.5 rounded text-xs font-bold ${item.isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                        ${item.isCorrect ? '正解' : '不正解'}
                      </span>
                    </div>
                    ${item.question.work ? `<p class="text-xs font-bold text-vermilion">${item.question.work}: ${item.question.sentence}</p>` : ''}
                    <p class="text-sm font-semibold">${item.question.question}</p>
                    <p class="text-xs text-gray-500">あなたの回答: ${item.question.shuffledOptions[item.userChoice]}</p>
                    <p class="text-xs text-indigo dark:text-gold font-bold">正解: ${item.question.shuffledOptions[item.question.correctIndex]}</p>
                    <p class="text-xs bg-washi dark:bg-nightSumi p-2 rounded text-gray-600 dark:text-gray-300">${item.question.explanation}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      navStudy(tab = 'jodoushi') {
        this.currentView = 'study';
        sound.playClick();
        const container = document.getElementById('app-container');

        container.innerHTML = `
          <div class="space-y-6 animate-fade-in">
            <!-- Header Tabs & Red Sheet Toggle -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-gold/30 pb-4">
              <div>
                <h2 class="font-japanese-title text-2xl font-bold text-indigo dark:text-gold">文法 活用表＆暗記シート</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">赤色マスをタップすると、それぞれの箇所が個別にめくれます。</p>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="app.toggleAllRedSheets()" class="px-3.5 py-1.5 bg-vermilion text-white text-xs font-bold rounded-lg shadow hover:bg-red-700 transition flex items-center gap-1.5">
                  <i class="fas fa-eye"></i> 赤シート全解禁 / 一括覆い
                </button>
              </div>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b border-gray-200 dark:border-gray-700 text-sm font-bold">
              <button onclick="app.navStudy('jodoushi')" class="px-5 py-2.5 border-b-2 transition ${tab === 'jodoushi' ? 'border-vermilion text-vermilion' : 'border-transparent text-gray-500 hover:text-gray-700'}">
                <i class="fas fa-cubes mr-1"></i> 助動詞 (28種)
              </button>
              <button onclick="app.navStudy('verbs')" class="px-5 py-2.5 border-b-2 transition ${tab === 'verbs' ? 'border-vermilion text-vermilion' : 'border-transparent text-gray-500 hover:text-gray-700'}">
                <i class="fas fa-book-open mr-1"></i> 動詞 (9活用)
              </button>
              <button onclick="app.navStudy('adjectives')" class="px-5 py-2.5 border-b-2 transition ${tab === 'adjectives' ? 'border-vermilion text-vermilion' : 'border-transparent text-gray-500 hover:text-gray-700'}">
                <i class="fas fa-feather mr-1"></i> 形容詞・形容動詞
              </button>
            </div>

            <!-- Table Content Area -->
            <div class="bg-white dark:bg-nightCard border border-gold/30 rounded-2xl p-4 sm:p-6 shadow-md overflow-x-auto">
              ${this.renderGrammarTable(tab)}
            </div>
          </div>
        `;
      }

      renderGrammarTable(tab) {
        if (tab === 'jodoushi') {
          return `
            <table class="w-full text-left text-xs sm:text-sm border-collapse min-w-[650px]">
              <thead>
                <tr class="bg-gold/10 text-indigo dark:text-gold border-b border-gold/30 font-bold">
                  <th class="p-3">助動詞</th>
                  <th class="p-3">接続</th>
                  <th class="p-3">活用型</th>
                  <th class="p-3">未然・連用・終止・連体・已然・命令</th>
                  <th class="p-3">主な意味</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                ${GRAMMAR_DATA.jodoushi.map(j => `
                  <tr class="hover:bg-gold/5 transition">
                    <td class="p-3 font-bold text-vermilion font-japanese-title text-base">${j.name}</td>
                    <td class="p-3"><span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${j.connection}</span></td>
                    <td class="p-3 text-gray-500">${j.type}</td>
                    <td class="p-3 font-mono">
                      <span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${j.conjugations.join(' ・ ')}</span>
                    </td>
                    <td class="p-3"><span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${j.meaning}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else if (tab === 'verbs') {
          return `
            <table class="w-full text-left text-xs sm:text-sm border-collapse min-w-[650px]">
              <thead>
                <tr class="bg-gold/10 text-indigo dark:text-gold border-b border-gold/30 font-bold">
                  <th class="p-3">活用型</th>
                  <th class="p-3">代表語</th>
                  <th class="p-3">活用語尾（未然・連用・終止・連体・已然・命令）</th>
                  <th class="p-3">注意事項・覚える語</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                ${GRAMMAR_DATA.verbs.map(v => `
                  <tr class="hover:bg-gold/5 transition">
                    <td class="p-3 font-bold text-indigo dark:text-gold font-japanese-title">${v.name}</td>
                    <td class="p-3 font-bold">${v.example}</td>
                    <td class="p-3 font-mono">
                      <span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${v.conjugations.join(' ・ ')}</span>
                    </td>
                    <td class="p-3 text-xs text-gray-500">${v.note}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else if (tab === 'adjectives') {
          return `
            <div class="space-y-6">
              ${GRAMMAR_DATA.adjectives.map(a => `
                <div class="border border-gold/20 rounded-xl p-4 space-y-3">
                  <div class="flex items-center justify-between border-b border-gold/20 pb-2">
                    <h4 class="font-japanese-title text-base font-bold text-indigo dark:text-gold">${a.name} （例：${a.example}）</h4>
                    <span class="text-xs text-gray-400">${a.note}</span>
                  </div>
                  ${a.hon ? `
                    <div class="text-xs space-y-1 font-mono">
                      <p><span class="font-bold text-gray-500">本活用:</span> <span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${a.hon.join(' ・ ')}</span></p>
                      <p><span class="font-bold text-gray-500">カリ活用:</span> <span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${a.kari.join(' ・ ')}</span></p>
                    </div>
                  ` : `
                    <div class="text-xs font-mono">
                      <p><span class="font-bold text-gray-500">活用語尾:</span> <span class="red-sheet-hidden" onclick="app.toggleRedSheet(this)">${a.conjugations.join(' ・ ')}</span></p>
                    </div>
                  `}
                </div>
              `).join('')}
            </div>
          `;
        }
      }

      toggleRedSheet(el) {
        sound.playClick();
        el.classList.toggle('revealed');
      }

      toggleAllRedSheets() {
        sound.playClick();
        const items = document.querySelectorAll('.red-sheet-hidden');
        if (items.length === 0) return;

        const anyHidden = Array.from(items).some(i => !i.classList.contains('revealed'));
        items.forEach(i => {
          if (anyHidden) {
            i.classList.add('revealed');
          } else {
            i.classList.remove('revealed');
          }
        });
      }
    }

    const app = new GrammarApp();
    window.onload = () => {
      app.init();
    };
  </script>
</body>
</html>
